<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <h2>STUDENT PORTAL <span>2026</span></h2>
    </header>

    <main class="container">
      <section class="form-card">
        <p class="tag">ONLINE APPLICATION</p>
        <h1>Student Registration<span>.</span></h1>
        <p class="subtitle">
          Enter your details to complete your registration.
        </p>

        <form action="submit.php" method="POST" id="regForm">
          <h3>01 / Personal Information</h3>

          <div class="form-grid">
            <div class="field">
              <label>Full Name</label>
              <input
                type="text"
                name="fullname"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="field">
              <label>Email Address</label>
              <input
                type="email"
                name="email"
                placeholder="example@email.com"
                required
              />
            </div>

            <div class="field">
              <label>Phone Number</label>
              <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="10-digit mobile number"
                maxlength="10"
                required
              />
            </div>
            <div class="field">
              <label>Date of Birth</label>
              <input
                type="date"
                name="dob"
                id="dob"
                required
                onclick="this.showPicker()"
              />
            </div>

            <div class="field">
              <label>Gender</label>
              <select name="gender" required>
                <option value="">Select gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <h3>02 / Academic Information</h3>

          <div class="form-grid">
            <div class="field">
              <label>Course</label>
              <select name="course" required>
                <option value="">Select course</option>
                <option value="Computer Science Engineering">
                  Computer Science Engineering
                </option>
                <option value="Information Science Engineering">
                  Information Science Engineering
                </option>
                <option value="Electronics and Communication Engineering">
                  Electronics and Communication Engineering
                </option>
                <option value="Mechanical Engineering">
                  Mechanical Engineering
                </option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="field">
              <label>Year of Study</label>
              <select name="year" required>
                <option value="">Select year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>

            <div class="field full">
              <label>Address</label>
              <textarea
                name="address"
                rows="3"
                placeholder="Enter your address"
                required
              ></textarea>
            </div>
          </div>

          <button type="submit">SUBMIT APPLICATION <span>→</span></button>
        </form>
      </section>
    </main>

    <footer>STUDENT PORTAL © 2026</footer>
  </body>
</html>
